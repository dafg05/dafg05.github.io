<div class="wow animated fadeIn" data-wow-delay=".15s">
    <a href="{{ music_url }}" class="project card text-themed" {%- if external and site.open_new_tab -%} target="_blank" {%- endif -%}>
      {%- if music_img -%}
      <img id="{{ music_id }}-img" class="card-img-top" src="{{ music_img }}" alt="{{ music_name }}" />
      {%- endif -%}
      <div class="card-body">
        <h5 id="{{ music_id }}-name" class="card-title">
            {%- if music_type == "remote" -%}
            <i class="fab fa-github" data-toggle="tooltip" data-placement="bottom" data-delay="250" title="GitHub Repository"></i> |&nbsp;
            {%- endif -%}
          {{ music_name }}
        </h5>
        <p id="{{ music_id }}-desc" class="card-text">{{ music_desc }}</p>
        <p id="{{ music_id }}-tools" class="card-text">
          {%- for tool in music_tools -%}
          <span class="badge badge-pill text-primary border border-primary ml-1">{{ tool }}</span>
          {%- endfor -%}
        </p>
      </div>
    </a>
  </div>
